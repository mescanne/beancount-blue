<style>
/* API Config Manager Styles */
.api-config {
    display: flex;
    height: calc(100vh - 60px);
    margin: -1rem;
    font-family: var(--font-family, sans-serif);
}
.api-sidebar {
    width: 250px;
    border-right: 1px solid var(--color-sidebar-border, #ddd);
    background: var(--color-sidebar-background, #fafafa);
    padding: 1rem;
    overflow-y: auto;
}
.api-sidebar h3 {
    margin-top: 0;
    font-size: 1.1em;
    border-bottom: 1px solid var(--color-sidebar-border, #ddd);
    padding-bottom: 8px;
}
.api-main {
    flex: 1;
    display: flex;
    flex-direction: column;
    background: var(--color-background, #fff);
}
.api-header {
    padding: 1rem;
    border-bottom: 1px solid var(--color-sidebar-border, #ddd);
    display: flex;
    justify-content: space-between;
    align-items: center;
}
.api-header h2 {
    margin: 0;
    font-size: 1.2em;
}
.api-editor-container {
    flex: 1;
    position: relative;
}
#editor-container {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
}
.api-actions {
    padding: 1rem;
    border-top: 1px solid var(--color-sidebar-border, #ddd);
    display: flex;
    gap: 1rem;
    justify-content: flex-end;
    background: var(--color-sidebar-background, #fafafa);
}
.api-file-item {
    padding: 8px 12px;
    cursor: pointer;
    border-radius: 4px;
    margin-bottom: 4px;
    border: 1px solid transparent;
    transition: all 0.2s;
    background: var(--color-background, #fff);
}
.api-file-item:hover {
    border-color: var(--color-sidebar-border, #ccc);
}
.api-file-item.active {
    background: var(--color-button-bg, #007bff);
    color: var(--color-button-text, #fff);
    border-color: transparent;
}
</style>

<div class="api-config" id="api-config-root">
    <div class="api-sidebar">
        <h3>Configuration Files</h3>
        <div id="api-file-list"></div>
    </div>
    <div class="api-main">
        <div class="api-header">
            <h2 id="current-file-name">Select a file</h2>
            <button id="btn-delete" class="btn" style="color: var(--color-background-negative); border: none; background: transparent; cursor: pointer;" disabled>Delete</button>
        </div>
        <div class="api-editor-container">
            <div id="editor-container"></div>
        </div>
        <div class="api-actions">
            <button id="btn-save" class="btn" disabled>Save</button>
            <button id="btn-import" class="btn btn-primary" disabled>Import Data</button>
        </div>
    </div>
</div>
