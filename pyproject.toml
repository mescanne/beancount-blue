[project]
name = "beancount_blue"
dynamic = ["version"]
description = "This is a template repository for Python projects that use uv for their dependency management."
authors = [{ name = "Mark Scannell", email = "mescanne@gmail.com" }]
readme = "README.md"
keywords = ['python']
requires-python = ">=3.12,<4.0"
classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
	"authlib>=1.4.1",
	"beancount",
	"beangulp>=0.2.0",
	"fava>=1.30.12",
	"httpx>=0.28.1",
	"pydantic>=2.12.4",
	"pydantic-settings",
	"pymonzo>=2.2.1",
	"python-dateutil",
	"pyyaml>=6.0.2",
]

[project.urls]
Homepage = "https://mescanne.github.io/beancount-blue/"
Repository = "https://github.com/mescanne/beancount-blue"
Documentation = "https://mescanne.github.io/beancount-blue/"

[project.scripts]
importer = "beancount_blue.importer.cli:app"

[dependency-groups]
dev = [
    "pytest>=7.2.0",
    "pre-commit>=2.20.0",
    "deptry>=0.20.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.12.0",
    "basedpyright>=1.1.402",
    "git-cliff>=2.4.0",
    "setuptools-scm",
    "rust-just>=1.43.1",
    "mkdocs<1.6.0",
    "mkdocs-material>=9.5.18",
    "mkdocstrings[python]>=0.28.3",
    "pip-audit>=2.10.0",
    "playwright>=1.58.0",
    "pytest-playwright>=0.7.2",
]

[build-system]
requires = ["setuptools>=61.0", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["beancount_blue"]

[tool.setuptools_scm]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 120
fix = true

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "SIM",
    "UP",  # pyupgrade (modernize python syntax)
    "S",   # flake8-bandit (security checks)
    "TRY", # tryceratops (exception handling antipatterns)
    "W",   # pycodestyle warnings
]
ignore = ["TRY003", "E501", "TRY301", "TRY400", "TRY300"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "S603", "S607"]

[tool.ruff.format]
preview = true

[tool.basedpyright]
typeCheckingMode = "strict"
reportMissingTypeStubs = false
reportExplicitAny = false

include = ["beancount_blue"]
exclude = ["**/__pycache__"]

[tool.coverage.report]
skip_empty = true

[tool.coverage.run]
branch = true
source = ["beancount_blue"]

[tool.deptry]
exclude = ["^.venv/", "^existing_importers/", "t.py"]

[tool.deptry.per_rule_ignores]
DEP003 = ["flask", "markdown2"]
DEP004 = ["pytest", "playwright"]
